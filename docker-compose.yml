# 운영 위치: beta (172.26.4.90). 소스와 빌드는 alpha에서, 배포는 alpha에서 `laea svc deploy newapp`.
# 포트는 127.0.0.1과 beta 사설 IP에만 연다 — 외부 요청은 gate만 들어온다.
# newapp.laea.io → gate nginx → beta:4060. DB는 cortie-db의 전용 DB(newapp_db / newapp_app).
name: newapp
services:
  newapp-web:
    build: ./web
    image: cortie/newapp-web:latest
    env_file: ./web/.env.docker
    ports:
      - "127.0.0.1:4060:4060"
      - "172.26.4.90:4060:4060"
    restart: unless-stopped
    mem_limit: 384m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://127.0.0.1:4060/robots.txt || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
